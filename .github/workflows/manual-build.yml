name: Owner Manual Build

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40-character commit SHA from Pantonyeung/morefunos-vnext'
        required: true
        type: string
      build_kind:
        description: 'Manual gate to execute'
        required: true
        default: compatibility-probe
        type: choice
        options:
          - foundation
          - compatibility-probe

permissions:
  contents: read

concurrency:
  group: owner-manual-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_REPO: Pantonyeung/morefunos-vnext
      REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
      BUILD_KIND: ${{ inputs.build_kind }}

    steps:
      - name: Validate immutable build request
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_sha must be an exact 40-character Git commit SHA" >&2
            exit 1
          fi
          case "$BUILD_KIND" in
            foundation|compatibility-probe) ;;
            *) echo "Unsupported build_kind: $BUILD_KIND" >&2; exit 1 ;;
          esac

      - name: Checkout builder definition
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout exact private MoreFunOS source SHA
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-vnext
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.VNEXT_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SOURCE_SHA="$(git -C source rev-parse HEAD)"
          test "$ACTUAL_SOURCE_SHA" = "${REQUESTED_SOURCE_SHA,,}"
          echo "Verified immutable private source SHA: $ACTUAL_SOURCE_SHA"

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Verify preinstalled Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          echo "Android SDK 36 + Build-tools 36.0.0 present."

      - name: Install locked dependencies
        working-directory: source
        run: npm ci --no-audit --no-fund

      - name: Full software preflight
        working-directory: source
        run: npm run check:foundation

      - name: Capacitor sync
        working-directory: source
        run: npm run cap:sync

      - name: Android unit tests and assemble
        working-directory: source
        run: gradle -p native/android-smt testDebugUnitTest assembleDebug --stacktrace

      - name: Generate immutable build metadata
        if: inputs.build_kind == 'compatibility-probe'
        id: metadata
        working-directory: source
        shell: bash
        env:
          BUILDER_SHA: ${{ github.sha }}
          BUILDER_RUN_ID: ${{ github.run_id }}
          BUILDER_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          APK="native/android-smt/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          VERSION_NAME="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' native/android-smt/app/build.gradle | head -n 1)"
          MIN_SDK="$(sed -n 's/.*minSdkVersion = \([0-9][0-9]*\).*/\1/p' native/android-smt/variables.gradle | head -n 1)"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          APK_FILENAME="MoreFunOS-SMT-${VERSION_NAME}-${REQUESTED_SOURCE_SHA:0:12}.apk"
          cp "$APK" "$APK_FILENAME"
          printf '%s  %s\n' "$APK_SHA256" "$APK_FILENAME" > SHA256SUMS
          export VERSION_NAME MIN_SDK APK_SHA256 APK_FILENAME
          node <<'NODE'
          const fs = require('fs');
          const metadata = {
            sourceRepository: process.env.SOURCE_REPO,
            sourceSha: process.env.REQUESTED_SOURCE_SHA.toLowerCase(),
            buildKind: process.env.BUILD_KIND,
            versionName: process.env.VERSION_NAME,
            minSdk: Number(process.env.MIN_SDK),
            apkFilename: process.env.APK_FILENAME,
            apkSha256: process.env.APK_SHA256,
            builderRepository: process.env.BUILDER_REPO,
            builderSha: process.env.BUILDER_SHA,
            builderRunId: process.env.BUILDER_RUN_ID,
            builtAtUtc: new Date().toISOString()
          };
          fs.writeFileSync('build-metadata.json', JSON.stringify(metadata, null, 2) + '\n');
          NODE
          node scripts/verify-probe-artifact.mjs build-metadata.json
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_filename=$APK_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Deliver APK privately to source repository release
        if: inputs.build_kind == 'compatibility-probe'
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VNEXT_DELIVERY_WRITE_TOKEN }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          APK_FILENAME: ${{ steps.metadata.outputs.apk_filename }}
        run: |
          set -euo pipefail
          TAG="builder-${VERSION_NAME}-${REQUESTED_SOURCE_SHA:0:12}-run-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            "$APK_FILENAME" \
            build-metadata.json \
            SHA256SUMS \
            --repo "$SOURCE_REPO" \
            --target "$REQUESTED_SOURCE_SHA" \
            --title "SMT ${VERSION_NAME} | ${REQUESTED_SOURCE_SHA:0:12}" \
            --notes "Manual build from immutable source ${REQUESTED_SOURCE_SHA}. Builder ${GITHUB_REPOSITORY}@${GITHUB_SHA}, run ${GITHUB_RUN_ID}. Build output only; not Device/Hardware/Operational PASS." \
            --prerelease
