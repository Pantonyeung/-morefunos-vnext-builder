name: Owner Manual Build

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40-character commit SHA from Pantonyeung/morefunos-vnext'
        required: true
        type: string
      build_kind:
        description: 'Manual gate to execute'
        required: true
        default: mpc1
        type: choice
        options:
          - mpc1
          - foundation
          - compatibility-probe

permissions:
  contents: read

concurrency:
  group: owner-manual-build
  cancel-in-progress: false

jobs:
  build:
    if: github.actor == 'Pantonyeung'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_REPO: Pantonyeung/morefunos-vnext
      REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
      BUILD_KIND: ${{ inputs.build_kind }}
      EXPECTED_APP_SIGNING_CERT_SHA256: 8f66270541c419a90ae0e8b94a2c7796e13d5c06805b0919ce3f7f5b3602857a

    steps:
      - name: Validate immutable build request
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_sha must be an exact 40-character Git commit SHA" >&2
            exit 1
          fi
          case "$BUILD_KIND" in
            mpc1|foundation|compatibility-probe) ;;
            *) echo "Unsupported build_kind: $BUILD_KIND" >&2; exit 1 ;;
          esac
          if [[ ! "$EXPECTED_APP_SIGNING_CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Expected app-signing certificate identity is invalid" >&2
            exit 1
          fi

      - name: Checkout builder definition
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify builder remains manual-only
        run: node scripts/verify-builder-policy.mjs

      - name: Checkout exact private MoreFunOS source SHA
        uses: actions/checkout@v7
        with:
          repository: Pantonyeung/morefunos-vnext
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.VNEXT_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SOURCE_SHA="$(git -C source rev-parse HEAD)"
          test "$ACTUAL_SOURCE_SHA" = "${REQUESTED_SOURCE_SHA,,}"
          echo "Verified immutable private source SHA: $ACTUAL_SOURCE_SHA"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Verify preinstalled Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          echo "Android SDK 36 + Build-tools 36.0.0 + apksigner present."

      - name: Execute private source build without public source logs
        id: build_core
        continue-on-error: true
        shell: bash
        run: |
          set -u
          LOG="$GITHUB_WORKSPACE/private-build.log"
          : > "$LOG"

          run_stage() {
            local stage="$1"
            shift
            printf '\n== %s ==\n' "$stage" >> "$LOG"
            if "$@" >> "$LOG" 2>&1; then
              echo "$stage: PASS"
              return 0
            fi
            echo "$stage: FAIL (details withheld from public log)"
            echo "failed_stage=$stage" >> "$GITHUB_OUTPUT"
            return 1
          }

          cd source
          run_stage "locked-install" npm ci --no-audit --no-fund || exit 1
          run_stage "foundation-preflight" npm run check:foundation || exit 1
          run_stage "capacitor-sync" npm run cap:sync || exit 1
          run_stage "android-test-assemble" gradle -p native/android-smt testDebugUnitTest assembleDebug --stacktrace || exit 1
          echo "Private build core: PASS"

      - name: Stable-sign generated APK after private source build
        if: steps.build_core.outcome == 'success'
        id: stable_signing
        shell: bash
        env:
          VNEXT_ANDROID_KEYSTORE_B64: ${{ secrets.VNEXT_ANDROID_KEYSTORE_B64 }}
          VNEXT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.VNEXT_ANDROID_KEYSTORE_PASSWORD }}
          VNEXT_ANDROID_KEY_ALIAS: ${{ secrets.VNEXT_ANDROID_KEY_ALIAS }}
          VNEXT_ANDROID_KEY_PASSWORD: ${{ secrets.VNEXT_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for required_name in \
            VNEXT_ANDROID_KEYSTORE_B64 \
            VNEXT_ANDROID_KEYSTORE_PASSWORD \
            VNEXT_ANDROID_KEY_ALIAS \
            VNEXT_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!required_name:-}" ]]; then
              echo "Stable app-signing configuration is incomplete: missing $required_name" >&2
              exit 1
            fi
          done

          KEYSTORE="$RUNNER_TEMP/morefunos-vnext-app-signing.p12"
          APK="$GITHUB_WORKSPACE/source/native/android-smt/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -f "$APK"

          printf '%s' "$VNEXT_ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          test -s "$KEYSTORE"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-key-alias "$VNEXT_ANDROID_KEY_ALIAS" \
            --ks-pass env:VNEXT_ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:VNEXT_ANDROID_KEY_PASSWORD \
            "$APK"

          VERIFY_OUTPUT="$($APKSIGNER verify --verbose --print-certs "$APK")"
          CERT_SHA256="$(printf '%s\n' "$VERIFY_OUTPUT" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n 1 \
            | tr -d ':[:space:]' \
            | tr 'A-F' 'a-f')"
          SIGNER_COUNT="$(printf '%s\n' "$VERIFY_OUTPUT" \
            | grep -c '^Signer #[0-9][0-9]* certificate SHA-256 digest:' || true)"

          test "$SIGNER_COUNT" = "1"
          if [[ ! "$CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Stable APK signing certificate digest could not be verified" >&2
            exit 1
          fi
          if [[ "$CERT_SHA256" != "$EXPECTED_APP_SIGNING_CERT_SHA256" ]]; then
            echo "Stable APK signing certificate identity mismatch" >&2
            exit 1
          fi

          echo "certificate_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"
          echo "Stable APK signing identity verified: PASS"

      - name: Generate immutable build metadata
        if: steps.build_core.outcome == 'success' && steps.stable_signing.outcome == 'success' && (inputs.build_kind == 'mpc1' || inputs.build_kind == 'compatibility-probe')
        id: metadata
        working-directory: source
        shell: bash
        env:
          BUILDER_SHA: ${{ github.sha }}
          BUILDER_RUN_ID: ${{ github.run_id }}
          BUILDER_REPO: ${{ github.repository }}
          APP_SIGNING_CERT_SHA256: ${{ steps.stable_signing.outputs.certificate_sha256 }}
        run: |
          set -euo pipefail
          APK="native/android-smt/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          VERSION_NAME="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' native/android-smt/app/build.gradle | head -n 1)"
          MIN_SDK="$(sed -n 's/.*minSdkVersion = \([0-9][0-9]*\).*/\1/p' native/android-smt/variables.gradle | head -n 1)"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          APK_FILENAME="MoreFunOS-SMT-${VERSION_NAME}-${REQUESTED_SOURCE_SHA:0:12}.apk"
          cp "$APK" "$APK_FILENAME"
          printf '%s  %s\n' "$APK_SHA256" "$APK_FILENAME" > SHA256SUMS
          export VERSION_NAME MIN_SDK APK_SHA256 APK_FILENAME APP_SIGNING_CERT_SHA256
          node <<'NODE'
          const fs = require('fs');
          const metadata = {
            sourceRepository: process.env.SOURCE_REPO,
            sourceSha: process.env.REQUESTED_SOURCE_SHA.toLowerCase(),
            buildKind: process.env.BUILD_KIND,
            versionName: process.env.VERSION_NAME,
            minSdk: Number(process.env.MIN_SDK),
            apkFilename: process.env.APK_FILENAME,
            apkSha256: process.env.APK_SHA256,
            appSigningCertificateSha256: process.env.APP_SIGNING_CERT_SHA256,
            builderRepository: process.env.BUILDER_REPO,
            builderSha: process.env.BUILDER_SHA,
            builderRunId: process.env.BUILDER_RUN_ID,
            builtAtUtc: new Date().toISOString()
          };
          fs.writeFileSync('build-metadata.json', JSON.stringify(metadata, null, 2) + '\n');
          NODE
          node scripts/verify-probe-artifact.mjs build-metadata.json
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_filename=$APK_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Deliver APK privately to source repository release
        if: steps.build_core.outcome == 'success' && steps.stable_signing.outcome == 'success' && (inputs.build_kind == 'mpc1' || inputs.build_kind == 'compatibility-probe')
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VNEXT_DELIVERY_WRITE_TOKEN }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          APK_FILENAME: ${{ steps.metadata.outputs.apk_filename }}
          APP_SIGNING_CERT_SHA256: ${{ steps.stable_signing.outputs.certificate_sha256 }}
        run: |
          set -euo pipefail
          TAG="builder-${VERSION_NAME}-${REQUESTED_SOURCE_SHA:0:12}-run-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            "$APK_FILENAME" \
            build-metadata.json \
            SHA256SUMS \
            --repo "$SOURCE_REPO" \
            --target "$REQUESTED_SOURCE_SHA" \
            --title "SMT ${VERSION_NAME} | ${REQUESTED_SOURCE_SHA:0:12}" \
            --notes "Manual build from immutable source ${REQUESTED_SOURCE_SHA}. Stable app-signing certificate SHA-256: ${APP_SIGNING_CERT_SHA256}. Builder ${GITHUB_REPOSITORY}@${GITHUB_SHA}, run ${GITHUB_RUN_ID}. Build output only; not Device/Hardware/Operational PASS." \
            --prerelease

      - name: Deliver failed build log privately
        if: steps.build_core.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VNEXT_DELIVERY_WRITE_TOKEN }}
          FAILED_STAGE: ${{ steps.build_core.outputs.failed_stage }}
        run: |
          set -euo pipefail
          export FAILED_STAGE
          node <<'NODE'
          const fs = require('fs');
          const metadata = {
            sourceRepository: process.env.SOURCE_REPO,
            sourceSha: process.env.REQUESTED_SOURCE_SHA.toLowerCase(),
            buildKind: process.env.BUILD_KIND,
            builderRepository: process.env.GITHUB_REPOSITORY,
            builderSha: process.env.GITHUB_SHA,
            builderRunId: process.env.GITHUB_RUN_ID,
            failedStage: process.env.FAILED_STAGE || 'unknown',
            builtAtUtc: new Date().toISOString(),
            status: 'FAILED'
          };
          fs.writeFileSync('build-failure-metadata.json', JSON.stringify(metadata, null, 2) + '\n');
          NODE
          TAG="builder-failure-${REQUESTED_SOURCE_SHA:0:12}-run-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            "$GITHUB_WORKSPACE/private-build.log" \
            build-failure-metadata.json \
            --repo "$SOURCE_REPO" \
            --target "$REQUESTED_SOURCE_SHA" \
            --title "FAILED manual build | ${REQUESTED_SOURCE_SHA:0:12}" \
            --notes "Private diagnostics for failed manual builder run ${GITHUB_RUN_ID}. Raw private-source build logs were intentionally withheld from the public Actions log." \
            --prerelease

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/morefunos-vnext-app-signing.p12"

      - name: Fail job after private diagnostics delivery
        if: steps.build_core.outcome == 'failure'
        shell: bash
        run: |
          echo "Private source build failed. Full diagnostics were delivered only to the private source repository."
          exit 1
